name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: entityindex_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, curl, simplexml
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint PHP
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l | grep -v '^No syntax errors' || true
      - name: Integration tests (MySQL 8)
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=entityindex_test
          TEST_DB_USER: root
          TEST_DB_PASS: root
        run: php tests/run.php

  deploy:
    # Deploys to the production server over SFTP after the tests pass on main. See docs/DEPLOY.md.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lftp rsync
      - name: Deploy over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in SFTP_HOST SFTP_USERNAME SFTP_REMOTE_PATH SFTP_PRIVATE_KEY SFTP_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set (Settings > Environments > production)"; exit 1; }
          done
          KEYDIR="$(mktemp -d)"
          trap 'rm -rf "$KEYDIR"' EXIT
          printf '%s\n' "$SFTP_PRIVATE_KEY" > "$KEYDIR/key"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$KEYDIR/known_hosts"
          chmod 600 "$KEYDIR/key"
          export SFTP_KEY_FILE="$KEYDIR/key" SFTP_KNOWN_HOSTS_FILE="$KEYDIR/known_hosts"
          bash scripts/deploy-sftp.sh
